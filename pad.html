<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#3aa0ff">
<title>City Dash Controller</title>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<script src="js/peerjs.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root{--sky:#3aa0ff;--sun:#ffd23f;--orange:#ff6b35;--ink:#1d3557}
  html,body{margin:0;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
    font-family:'Lilita One',system-ui,sans-serif;color:#fff;background:linear-gradient(#3aa0ff,#9fdcff 70%,#ffe6b8)}
  #top{display:flex;justify-content:space-between;align-items:center;padding:20px 22px 8px;font-size:30px;text-shadow:0 3px 0 #0003}
  #coins::before{content:'';display:inline-block;width:24px;height:24px;border-radius:50%;margin-right:8px;vertical-align:-3px;
    background:radial-gradient(circle at 35% 35%,#fff6b0,#ffd23f 45%,#e0a100);box-shadow:0 2px 0 #b07b00}
  #status{text-align:center;font-size:16px;letter-spacing:.08em;color:var(--ink);opacity:.8;height:22px}
  #lanes{display:flex;gap:10px;justify-content:center;padding:14px 22px}
  .lane{flex:1;height:84px;border-radius:18px;background:#ffffff40;border:3px solid #ffffff80;display:grid;place-items:center;font-size:34px;transition:.12s}
  .lane.on{background:var(--sun);border-color:#fff;transform:translateY(-6px);box-shadow:0 8px 0 #c79a00}
  #pad{position:absolute;left:16px;right:16px;bottom:22px;top:250px;display:flex;flex-direction:column;gap:14px}
  .btn{flex:1;border-radius:28px;display:grid;place-items:center;font-size:44px;letter-spacing:.06em;text-shadow:0 4px 0 #0003;transition:transform .06s}
  #jump{background:linear-gradient(#4cc9f0,#3a86ff);box-shadow:0 10px 0 #1f5bc4}
  #roll{background:linear-gradient(#ffa24c,#ff6b35);box-shadow:0 10px 0 #c4441a;flex:.75}
  .btn.hit{transform:translateY(6px);box-shadow:none}
  #swipe{flex:1;border-radius:28px;border:4px dashed #ffffffb0;display:none;place-items:center;text-align:center;font-size:24px;line-height:1.6;color:var(--ink);background:#ffffff30}
  body.swipe .btn{display:none} body.swipe #swipe{display:grid}
  #bar{display:flex;gap:10px;justify-content:center;padding:0 22px}
  #bar button{font:inherit;font-size:16px;letter-spacing:.06em;border:0;border-radius:99px;padding:9px 16px;background:#ffffffd0;color:var(--ink);box-shadow:0 3px 0 #0002}
  #start{position:fixed;inset:0;z-index:9;display:grid;place-items:center;text-align:center;background:linear-gradient(#3aa0ffee,#ff6b35ee)}
  #start h1{font-size:54px;margin:0 0 8px;text-shadow:0 6px 0 #0003}
  #start p{font-size:22px;margin:6px 0}
  #start .go{display:inline-block;margin-top:22px;padding:16px 42px;border-radius:99px;background:var(--sun);color:var(--ink);font-size:30px;box-shadow:0 8px 0 #c79a00}
</style></head><body>
<div id="top"><span id="score">0</span><span id="coins">0</span></div>
<div id="status">tap to play</div>
<div id="lanes"><div class="lane"></div><div class="lane on">🏃</div><div class="lane"></div></div>
<div id="bar"><button id="mode">MODE: TILT</button><button id="center">RECENTRE</button></div>
<div id="pad">
  <div class="btn" id="jump">JUMP ⬆</div>
  <div class="btn" id="roll">ROLL ⬇</div>
  <div id="swipe"><div>swipe ← → to change lane<br>swipe ⬆ jump · swipe ⬇ roll<br>tap = jump</div></div>
</div>
<div id="start"><div><h1>CITY DASH</h1><p>tilt left / right → change lane</p><p>JUMP &amp; ROLL buttons (or swipe)</p><div id="codeBox" style="display:none;margin-top:18px"><p>room code on the TV:</p><input id="code" inputmode="numeric" maxlength="4" placeholder="1234" style="font:inherit;font-size:40px;width:180px;text-align:center;border:0;border-radius:18px;padding:8px;color:#1d3557"></div><div class="go">TAP TO PLAY</div></div></div>
<script>
const $=id=>document.getElementById(id), lanesEl=[...document.querySelectorAll('.lane')];
let lane=1, g0=null, gamma=0, ev=[], mode='tilt', live=false, lastState='ready';
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(_){}};

function setLane(l){ l=Math.max(0,Math.min(2,l)); if(l!==lane){ lane=l; buzz(8); setTimeout(send,0); }
  lanesEl.forEach((e,i)=>{e.classList.toggle('on',i===lane); e.textContent=i===lane?'🏃':'';}); }

addEventListener('deviceorientation',e=>{
  if(e.gamma==null) return;
  if(g0===null) g0=e.gamma;
  gamma=e.gamma-g0;
  if(mode!=='tilt') return;
  // hysteresis: need 14° to leave centre, back under 7° to return
  if(gamma<-14) setLane(0); else if(gamma>14) setLane(2);
  else if(Math.abs(gamma)<7) setLane(1);
});

function act(name,btn){ ev.push(name); setTimeout(send,0); buzz(name==='jump'?15:10); if(btn){btn.classList.add('hit');setTimeout(()=>btn.classList.remove('hit'),120);} }
$('jump').addEventListener('pointerdown',e=>act('jump',e.currentTarget));
$('roll').addEventListener('pointerdown',e=>act('roll',e.currentTarget));

// swipe mode
let sx=0,sy=0,st=0;
$('swipe').addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;st=performance.now();});
$('swipe').addEventListener('pointerup',e=>{
  const dx=e.clientX-sx, dy=e.clientY-sy;
  if(Math.hypot(dx,dy)<25) return act('jump');
  if(Math.abs(dx)>Math.abs(dy)) setLane(lane+(dx>0?1:-1)); else act(dy<0?'jump':'roll');
});

$('mode').onclick=()=>{ mode=mode==='tilt'?'swipe':'tilt'; document.body.classList.toggle('swipe',mode==='swipe'); $('mode').textContent='MODE: '+mode.toUpperCase(); if(mode==='tilt') g0=null; };
$('center').onclick=()=>{ g0=null; setLane(1); buzz(20); };

// ---- link to the TV over PeerJS (WebRTC) ----
const params=new URLSearchParams(location.search);
let room=params.get('room')||''; try{ if(!room) room=localStorage.getItem('citydash-pad-room')||''; }catch(_){}
if(!/^\d{4}$/.test(room)) $('codeBox').style.display='block'; else $('code').value=room;
let peer=null, conn=null, lock=null;
function send(){ if(conn&&conn.open){ const e=ev; ev=[]; try{conn.send({lane,ev:e});}catch(_){ ev=e.concat(ev); } } }
function connect(){
  if(!peer||peer.destroyed){ peer=new Peer({debug:1}); peer.on('open',connect); peer.on('error',e=>{ $('status').textContent= e.type==='peer-unavailable'?'TV not found — check the room code':'connection problem — retrying…'; setTimeout(connect,2500); }); peer.on('disconnected',()=>setTimeout(()=>{ if(!peer.destroyed) peer.reconnect(); },1000)); return; }
  if(!peer.id||peer.disconnected) return;
  $('status').textContent='connecting to room '+room+'…';
  const c=peer.connect('citydash-'+room,{serialization:'json',reliable:true});
  c.on('open',()=>{ conn=c; $('status').textContent='connected ✓ press JUMP'; buzz([20,40,20]); send(); });
  c.on('data',onHud);
  setTimeout(()=>{ if(!c.open){ try{c.close()}catch(_){} if(!conn||!conn.open) connect(); } },8000);
  c.on('close',()=>{ if(conn===c){ conn=null; $('status').textContent='disconnected — reconnecting…'; setTimeout(connect,1500); } });
}
function onHud(h){
  $('score').textContent=h.score; $('coins').textContent=h.coins;
  $('status').textContent = h.state==='over' ? 'BUSTED! press JUMP to run again' : h.state==='ready' ? 'press JUMP to start' : (h.power||'running…');
  if(h.state==='play' && lastState!=='play' && mode==='swipe') setLane(1);
  lastState=h.state;
  if(h.buzz==='crash') buzz([250,80,250,80,500]);
  else if(h.buzz==='shield') buzz([60,40,60]);
  else if(h.buzz==='power') buzz([25,30,25,30,25]);
}
setInterval(send,350);  // heartbeat so the TV knows we're here
document.addEventListener('visibilitychange',async()=>{ if(document.visibilityState==='visible'&&live){ try{lock=await navigator.wakeLock.request('screen')}catch(_){} if(!conn||!conn.open) connect(); } });

$('start').onclick=async e=>{
  if(e.target.id==='code') return;
  if(!/^\d{4}$/.test(room)){ room=$('code').value.trim(); if(!/^\d{4}$/.test(room)){ $('code').focus(); return; } }
  try{ localStorage.setItem('citydash-pad-room',room); }catch(_){}
  $('start').remove(); live=true; g0=null;
  try{await document.documentElement.requestFullscreen()}catch(_){}
  try{lock=await navigator.wakeLock.request('screen')}catch(_){}
  buzz(30); connect();
};

</script></body></html>
